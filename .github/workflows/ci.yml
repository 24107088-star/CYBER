
name: CYBER Backend CI

on:
  push:
    branches: [main, feature/readme]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile backend/main.py

      - name: Build project package
        run: |
          mkdir -p build
          cp backend/main.py build/main.py
          tar -czf cyber-backend.tar.gz -C build main.py

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-backend
          path: cyber-backend.tar.gz